[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-resume-screener"
version = "0.1.0"
description = "A smart resume screener and analyzer utilizing pgvector and LLMs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.5",
    "sentence-transformers>=2.5.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "fpdf2>=2.7.9"
]

[tool.pytest.ini_options]
# Add the project root to sys.path so `from src.*` imports resolve without
# a PYTHONPATH override. Required because the package is installed as
# "smart-resume-screener" (dist name) but tests import via the `src` directory.
pythonpath = ["."]
asyncio_mode = "strict"
