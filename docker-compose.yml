version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-resume-screener-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_resume_screener
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_resume_screener"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smart-resume-screener-app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smart_resume_screener
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
